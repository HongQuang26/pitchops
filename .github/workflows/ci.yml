name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['automation/**']
  pull_request:
    branches: [main]
    paths-ignore: ['automation/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python 3.13 · contracts · package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev,automation]'
      - name: Validate notebooks and dashboard syntax
        run: python scripts/validate_project.py
      - name: Test data, models, delivery and scheduling contracts
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Build distributable package
        run: python -m build
      - name: Upload test report only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-test-report
          path: reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
