name: Weekly MLOps
run-name: Weekly MLOps · ${{ inputs.mode || 'train' }}
on:
  schedule:
    - cron: '23 7 * * 5' # Friday 14:23 Asia/Ho_Chi_Minh
    - cron: '53 7 * * 6' # Recovery check only if no recent success
  workflow_dispatch:
    inputs:
      mode:
        description: 'Train and deploy, or verify configuration without any provider downloads'
        type: choice
        options: [verify, train]
        default: verify
permissions:
  contents: read
concurrency:
  group: pitchops-weekly-production
  cancel-in-progress: false
jobs:
  weekly:
    name: Collect → train → validate → encrypted delivery
    if: github.repository == 'HongQuang26/pitchops' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PITCHOPS_ROOT: /tmp/pitchops_weekly
      PITCHOPS_MODE: ${{ inputs.mode || 'train' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/runtime.txt
      - name: Install project
        run: python -m pip install -c requirements/runtime.txt -e '.[dev,automation]'
      - name: Test before accessing providers
        run: |
          python scripts/validate_project.py
          python -m pytest -q --tb=short
      - name: Check recovery schedule
        id: due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_weekly_due.py
      - name: Collect, train, validate and deliver
        if: steps.due.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pitchops.weekly --root "$PITCHOPS_ROOT" --mode "$PITCHOPS_MODE"
      - name: Publish public receipt only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weekly-receipt-${{ github.run_id }}
          path: |
            /tmp/pitchops_weekly/weekly_report.json
            /tmp/pitchops_weekly/weekly_receipt.json
            /tmp/pitchops_weekly/weekly_failure.json
          if-no-files-found: ignore
          retention-days: 30
